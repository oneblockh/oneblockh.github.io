<!DOCTYPE html><html lang="zh"><meta http-equiv="content-type" content="text/html; charset=UTF-8"><title>oneblockh</title><meta name="darkreader-lock"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<head>
  <style>
    :root{--background-color: #dadada;--main-color:#000000;--line-shadow:0 0 0 2px rgba(199,199,199,0.39),0 16px 32px rgba(0,0,0,0.5), 0px -1px 1px rgba(255, 255, 255, 0.39),0px 1px 1px rgba(225, 225, 225, 0.39);--item-transition:all 0.5s cubic-bezier(0.5, 0.2, 0.99, 0.99);}
    @media (prefers-color-scheme: dark) {:root{--background-color: #20262c;--main-color:#ffffff;}}
    html{width:100%;height:100%}
    body{background-color: var(--background-color);color:var(--main-color);background-image: url(background.webp);background-size: cover;transition:var(--item-transition)}
    .block_main{backdrop-filter:blur(5.2px) saturate(125%) url(#ui-glass);box-shadow:var(--line-shadow);}
    .block_border{border-radius: 25px;border: 1px solid transparent;padding: 3px;transition:var(--item-transition)}
    #article_information{background-color: transparent;border: 1px solid transparent;border-radius: 25px;padding: 16px;width: 100%;margin-top: 19px;box-shadow: var(--line-shadow);overflow: hidden;transition:var(--item-transition)}
    #back_button{background-color: transparent;border-radius: 25px;color: var(--main-color);box-shadow: var(--line-shadow);padding: 0 8px;margin-left: 16px;margin-right: 16px;transition:var(--item-transition)}
    #search_input_bar{flex:1;min-width: 125px;background-color: transparent;padding: 8px 16px;display: block;color:var(--main-color);border-radius: 25px;box-shadow: var(--line-shadow);transition:var(--item-transition)}    
    .block_border:hover,#back_button:hover,#search_input_bar:hover,#article_information:hover{box-shadow: 0 0 0 2px rgba(199,199,199,0.39), 0px -1px 1px rgba(255, 255, 255, 0.39),0px 1px 1px rgba(225, 225, 225, 0.39),0px 0px 19px 11px rgba(225, 225, 225, 0.5);}
    #article_information h3{bottom: 8px;margin:0;text-align: left;color:var(--main-color);}
    #article_information p{text-align: left;color:var(--main-color);}
    svg{fill:var(--main-color);}
    ::placeholder{color: var(--main-color);}
    #blog_article_main blockquote{border-left: 3px solid var(--main-color);padding-left: 16px;margin: 20px 0;}
    #blog_article_main pre {background: rgba(96, 102, 101, 0.5);color: #f8fafc;padding: 16px;border-radius: 11px;overflow-x: auto;margin: 20px 0;}
    table{border: 1px solid var(--main-color);border-radius: 11px;}
    th,td{border: 1px solid var(--main-color);border-radius: 11px;padding: 9px;}
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/css-vars-ponyfill@2"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/marked@4.2.5/marked.min.js"></script>
  <script>cssVars();</script>
  <svg style="display: none"><filter id="ui-glass"><feTurbulence type="turbulence" baseFrequency="0.00225" numOctaves="2" result="noise" /><feDisplacementMap in="SourceGraphic" in2="noise" scale="77" /></filter></svg>
</head>
<body>
  <header role="banner">
    <h3 style="margin-top: 25px;padding:8px;" align="center">oneblockh's blog</h3>
    <div class="block_main" style="display:flex;margin-top: 25px;padding:16px;border-radius: 25px;">
      <img alt="oneblockh" width="100px" height="100px" src="avatars.png" style="border-radius: 52px;border: 1px solid rgba(125,125,125,0.5);">
      <div style="width: 8px;height: 3px;"></div>
      <div style="display:inline-block;text-align:left;">
        <h3 style="margin: 3px;">oneblockh</h3>
        <p style="margin: 3px;">Learning...</p>
        <div style="display: flex;">
          <a href="https://github.com/oneblockh" width="32" height="32" class="block_border" title="github"><svg alt="github" width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M24,1.9a21.6,21.6,0,0,0-6.8,42.2c1,.2,1.8-.9,1.8-1.8V39.4c-6,1.3-7.9-2.9-7.9-2.9a6.5,6.5,0,0,0-2.2-3.2C6.9,31.9,9,32,9,32a4.3,4.3,0,0,1,3.3,2c1.7,2.9,5.5,2.6,6.7,2.1a5.4,5.4,0,0,1,.5-2.9C12.7,32,9,28,9,22.6A10.7,10.7,0,0,1,11.9,15a6.2,6.2,0,0,1,.3-6.4,8.9,8.9,0,0,1,6.4,2.9,15.1,15.1,0,0,1,5.4-.8,17.1,17.1,0,0,1,5.4.7,9,9,0,0,1,6.4-2.8,6.5,6.5,0,0,1,.4,6.4A10.7,10.7,0,0,1,39,22.6C39,28,35.3,32,28.5,33.2a5.4,5.4,0,0,1,.5,2.9v6.2a1.8,1.8,0,0,0,1.9,1.8A21.7,21.7,0,0,0,24,1.9Z"/></g></g></svg><!--github--></a>
          <div style="width: 11px;height: 11px;"></div>
          <a href="https://space.bilibili.com/3546635246242772" width="32" height="32" class="block_border" title="bilibili"><svg alt="bilibili" width="32" height="32" height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg"><path clip-rule="evenodd" d="M4.977 3.561a1.31 1.31 0 111.818-1.884l2.828 2.728c.08.078.149.163.205.254h4.277a1.32 1.32 0 01.205-.254l2.828-2.728a1.31 1.31 0 011.818 1.884L17.82 4.66h.848A5.333 5.333 0 0124 9.992v7.34a5.333 5.333 0 01-5.333 5.334H5.333A5.333 5.333 0 010 17.333V9.992a5.333 5.333 0 015.333-5.333h.781L4.977 3.56zm.356 3.67a2.667 2.667 0 00-2.666 2.667v7.529a2.667 2.667 0 002.666 2.666h13.334a2.667 2.667 0 002.666-2.666v-7.53a2.667 2.667 0 00-2.666-2.666H5.333zm1.334 5.192a1.333 1.333 0 112.666 0v1.192a1.333 1.333 0 11-2.666 0v-1.192zM16 11.09c-.736 0-1.333.597-1.333 1.333v1.192a1.333 1.333 0 102.666 0v-1.192c0-.736-.597-1.333-1.333-1.333z"></path></svg><!--bilibili--></a>
        </div>
      </div>
    </div>
  </header>
  <br>
  <main class="block_main" style="display: block;padding:25px;border-radius: 25px;margin-top: 11px;" role="main">
    <div style="display: flex;margin-top: 3px;margin-bottom: 25px;">
      <button id="back_button" class="block_border" title="back">
        <a style="font-size: 1.125rem;">←</a>
      </button>
      <input type="text" id="search_input_bar" class="block_border" placeholder="搜索文章" title="搜索文章">
    </div>
    <div id="blog_all_list"></div>
    <div id="blog_article" style="display: none;">
      <h3 id="article_title" style="border-bottom: 1px solid rgba(125,125,125,0.5)"></h3>
      <article id="blog_article_main"></article>
    </div>
  </main>
  <script type="module">
    const blogAll = {};
    const renderBlogList = (filterBlogNames) => {
      const blogAllList = document.getElementById("blog_all_list");
      blogAllList.innerHTML ="";
      const blogFileNames = Array.isArray(filterBlogNames) ? filterBlogNames : Object.keys(blogAll);
      for (const blogFileName of blogFileNames) {
        if (!Object.prototype.hasOwnProperty.call(blogAll, blogFileName)) continue;
        const {content = ""} = blogAll[blogFileName];
        const blogListItem = document.createElement("button");
        blogListItem.id = "article_information";
        blogListItem.title=`${blogFileName.replace(".md","")}`
        blogListItem.innerHTML = `<h3>${blogFileName.replace(".md","")}</h3><p>${content.slice(0, 60)}...</p>`;
        blogListItem.addEventListener("click", () => showBlogArticle(blogFileName, content));
        blogAllList.appendChild(blogListItem);
      }
    };
    const showBlogArticle = (blogFileName, content) => {
      document.getElementById("blog_all_list").style.display ="none";
      document.getElementById("blog_article").style.display ="block";
      document.getElementById("article_title").textContent = blogFileName.replace(".md","");
      document.getElementById("blog_article_main").innerHTML = marked.parse(content);
    };
    const showBlogList = () => {
      document.getElementById("blog_all_list").style.display = "block";
      document.getElementById("blog_article").style.display = "none";
    };
    const startSearch = () => {
      const searchInputBar = document.getElementById('search_input_bar');
      const findBlogArticle = () => {
        const keyword = searchInputBar.value.toLowerCase().trim();
        if (!keyword) {
          renderBlogList();
          return;
        }
        const matched = Object.keys(blogAll).filter((blogFileName) => blogFileName.replace(".md","").toLowerCase().includes(keyword),);
        renderBlogList(matched);
      };
      searchInputBar.addEventListener("input", findBlogArticle);
    };
    const loadBlogArticle = async () => {
      try {
        const response = await fetch("https://api.github.com/repos/oneblockh/oneblockh.github.io/contents/blog");
        if (!response.ok) throw new Error(response.statusText);
        const files = await response.json();
        const markdownFiles = files.filter((file) => file.name?.endsWith(".md"));
        await Promise.all(markdownFiles.map(async (file) => {
            const contentResponse = await fetch(file.download_url);
            if (!contentResponse.ok) return;
            blogAll[file.name] = {content: await contentResponse.text()};
          }),
        );
        renderBlogList();
      } catch (error) {console.error("Load blog articles failed:", error);}
    };
    document.addEventListener("DOMContentLoaded", () => {
      renderBlogList();
      document.getElementById("back_button").addEventListener("click", showBlogList);
      startSearch();
      loadBlogArticle();
    });
  </script>
<br>
<br>
<footer class="block_main" style="width:103px;margin: 0 auto 0;padding:8px;border-radius: 25px;" role="contentinfo">by_oneblockh</footer>
</body>
</html>
