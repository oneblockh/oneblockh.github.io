<!DOCTYPE html><html lang="zh"><meta http-equiv="content-type" content="text/html; charset=UTF-8"><title>oneblockh</title><meta name="darkreader-lock"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<head>
  <style>
    body,button,a,h3,p,input{transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);}
    :root{--background-color: #ababab;--text_and_line-color:#000000;}
    @media (prefers-color-scheme: dark) {:root{--background-color: #20262c;--text_and_line-color:#ffffff;}}
    body{background-color: var(--background-color);color:var(--text_and_line-color)}
    .block_main{backdrop-filter:blur(2.5px) saturate(125%);border: 1px solid var(--text_and_line-color)}
    .block_border{border-radius: 25px;border: 1px solid transparent;padding: 3px;}
    #blog_list_information{background-color: transparent;border-radius: 25px;padding: 16px;width: 100%;margin-top: 19px;border: 1px solid var(--text_and_line-color);overflow: hidden;}
    .block_border:hover,#blog_list_information:hover{border: 1px solid var(--text_and_line-color);box-shadow: 0px 0px 11px 8px rgba(225, 225, 225, 0.5);}
    #blog_list_information h3{bottom: 8px;margin:0;text-align: left;color:var(--text_and_line-color);}
    #blog_list_information p{text-align: left;color:var(--text_and_line-color);}
    #back_button{background-color: transparent;border-radius: 25px;color: var(--text_and_line-color);border: 1px solid var(--text_and_line-color);padding: 0 8px;}
    #search_input_bar{flex:1;min-width: 125px;background-color: transparent;padding: 8px 16px;display: block;color:var(--text_and_line-color);margin: 0 auto;border-radius: 25px;border: 1px solid var( --text_and_line-color);}    
    svg{fill:var(--text_and_line-color);}
    #blog_content blockquote{border-left: 3px solid var(--text_and_line-color);padding-left: 16px;margin: 20px 0;}
    #blog_content pre {background: rgba(96, 102, 101, 0.5);color: #f8fafc;padding: 16px;border-radius: 8px;overflow-x: auto;margin: 20px 0;}
    table,th,td{border: 1px solid var(--text_and_line-color);border-radius: 11px;border: 1px solid var(--text_and_line-color);padding: 16px;}
    table{border: 1px solid var(--text_and_line-color);border-radius: 11px;border: 1px solid var(--text_and_line-color);padding: 3px;}
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/css-vars-ponyfill@2"></script>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.5/marked.min.js"></script>
  <script>cssVars();</script>
</head>
<body>
  <header role="banner">
    <h3 style="margin-top: 25px;padding:8px;" align="center">oneblockh's blog</h3>
    <div class="block_main" style="display:flex;margin-top: 25px;padding:16px;border-radius: 25px;">
      <img alt="oneblockh" width="100px" height="100px" src="https://avatars.githubusercontent.com/u/189672981?v=4&size=64" style="border-radius: 52px;vertical-align:middle;border: 1px solid rgba(125,125,125,0.5);">
      <div style="width: 8px;height: 3px;"></div>
      <div style="display:inline-block;vertical-align:middle;text-align:left;">
        <h3 style="margin: 3px;">oneblockh</h3>
        <p style="margin: 3px;">Learning...</p>
        <div style="display: flex;">
          <a href="https://github.com/oneblockh" width="32" height="32" class="block_border" title="github"><svg alt="github" width="32" height="32" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M24,1.9a21.6,21.6,0,0,0-6.8,42.2c1,.2,1.8-.9,1.8-1.8V39.4c-6,1.3-7.9-2.9-7.9-2.9a6.5,6.5,0,0,0-2.2-3.2C6.9,31.9,9,32,9,32a4.3,4.3,0,0,1,3.3,2c1.7,2.9,5.5,2.6,6.7,2.1a5.4,5.4,0,0,1,.5-2.9C12.7,32,9,28,9,22.6A10.7,10.7,0,0,1,11.9,15a6.2,6.2,0,0,1,.3-6.4,8.9,8.9,0,0,1,6.4,2.9,15.1,15.1,0,0,1,5.4-.8,17.1,17.1,0,0,1,5.4.7,9,9,0,0,1,6.4-2.8,6.5,6.5,0,0,1,.4,6.4A10.7,10.7,0,0,1,39,22.6C39,28,35.3,32,28.5,33.2a5.4,5.4,0,0,1,.5,2.9v6.2a1.8,1.8,0,0,0,1.9,1.8A21.7,21.7,0,0,0,24,1.9Z"/></g></g></svg><!--github--></a>
          <div style="width: 11px;height: 11px;"></div>
          <a href="https://space.bilibili.com/3546635246242772" width="32" height="32" class="block_border" title="bilibili"><svg alt="bilibili" width="32" height="32" height="1em" style="flex:none;line-height:1" viewBox="0 0 24 24" width="1em" xmlns="http://www.w3.org/2000/svg"><path clip-rule="evenodd" d="M4.977 3.561a1.31 1.31 0 111.818-1.884l2.828 2.728c.08.078.149.163.205.254h4.277a1.32 1.32 0 01.205-.254l2.828-2.728a1.31 1.31 0 011.818 1.884L17.82 4.66h.848A5.333 5.333 0 0124 9.992v7.34a5.333 5.333 0 01-5.333 5.334H5.333A5.333 5.333 0 010 17.333V9.992a5.333 5.333 0 015.333-5.333h.781L4.977 3.56zm.356 3.67a2.667 2.667 0 00-2.666 2.667v7.529a2.667 2.667 0 002.666 2.666h13.334a2.667 2.667 0 002.666-2.666v-7.53a2.667 2.667 0 00-2.666-2.666H5.333zm1.334 5.192a1.333 1.333 0 112.666 0v1.192a1.333 1.333 0 11-2.666 0v-1.192zM16 11.09c-.736 0-1.333.597-1.333 1.333v1.192a1.333 1.333 0 102.666 0v-1.192c0-.736-.597-1.333-1.333-1.333z"></path></svg><!--bilibili--></a>
        </div>
      </div>
    </div>
  </header>
  <br>
  <main class="block_main" style="display: block;padding:25px;border-radius: 25px;margin-top: 11px;" role="main">
    <div style="display: flex;margin-top: 3px;margin-bottom: 25px;">
      <button id="back_button" class="block_border" style="margin-left: 16px;margin-right: 16px;">
        <a style="font-size: 1.125rem;">←</a>
      </button>
      <input type="text" id="search_input_bar" class="block_border" placeholder="搜索文章">
    </div>
    <div id="blog_all_list"></div>
    <div id="blog_article" style="display: none;">
      <h3 id="article_title" style="border-bottom: 1px solid rgba(125,125,125,0.5)"></h3>
      <article id="blog_content"></article>
    </div>
  </main>
  <script>
    var blog_all = {};
    document.addEventListener('DOMContentLoaded', function() {render_blog_list();document.getElementById('back_button').addEventListener('click', show_blog_list);start_search();});
    function render_blog_list(filter_blog_names) {
      var blog_all_list = document.getElementById('blog_all_list');
      blog_all_list.innerHTML = '';
      var blog_file_names;
      if (Array.isArray(filter_blog_names)) {
        blog_file_names = filter_blog_names;
      } else {
        blog_file_names = Object.keys(blog_all);
      }
      for (var i = 0; i < blog_file_names.length; i++) {
        var blog_file_name = blog_file_names[i];
        if (!blog_all.hasOwnProperty(blog_file_name)) continue;
        var meta = blog_all[blog_file_name];
        var blog_list_start = document.createElement('button');
        blog_list_start.id = 'blog_list_information';
        blog_list_start.innerHTML = '<h3>' + blog_file_name.replace('.md', '') + '</h3>' + '<p>' + (meta.content ? meta.content.substring(0, 60) : '') + '...</p>';
        blog_list_start.addEventListener('click', (function(blog_file_name, content) { return function() { show_blog_article(blog_file_name, content); }; })(blog_file_name, meta.content));
        blog_all_list.appendChild(blog_list_start);
      }
    }
    function show_blog_article(blog_file_name, content) {
        document.getElementById('blog_all_list').style.display = 'none';
        document.getElementById('blog_article').style.display = 'block';
        document.getElementById('article_title').textContent = blog_file_name.replace('.md', '');
        document.getElementById('blog_content').innerHTML = marked.parse(content);
    }
    function show_blog_list() {
        document.getElementById('blog_all_list').style.display = 'block';
        document.getElementById('blog_article').style.display = 'none';
    }
    function start_search() {
      var search_input_bar = document.getElementById('search_input_bar');
      function find_blog_article() {
        var keyword = search_input_bar.value.toLowerCase().trim();
        if (!keyword) {render_blog_list();return;}
        var matched = [];
        for (var blog_file_name in blog_all) {
          if (!blog_all.hasOwnProperty(blog_file_name)) continue;
          var displayName = blog_file_name.replace('.md', '').toLowerCase();
          if (displayName.indexOf(keyword) !== -1) matched.push(blog_file_name);
        }
        render_blog_list(matched);
      }
      search_input_bar.addEventListener('input', find_blog_article);
    }
    function load_blog_article() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.github.com/repos/oneblockh/oneblockh.github.io/contents/blog', true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    var files = JSON.parse(xhr.responseText);
                    var i = 0;
                    function load_next_blog_article() {
                        if (i >= files.length) {render_blog_list();return;}
                        var file = files[i];
                        i++;
                        if (file.name && file.name.length > 3 && file.name.substr(file.name.length - 3) === '.md') {
                            var contentXhr = new XMLHttpRequest();
                            contentXhr.open('GET', file.download_url, true);
                            contentXhr.onreadystatechange = function() {
                              if (contentXhr.readyState === 4) {if (contentXhr.status === 200) {blog_all[file.name] = {content: contentXhr.responseText};}load_next_blog_article();}
                          };
                          contentXhr.send();
                        } 
                        else {load_next_blog_article();}
                    }
                    load_next_blog_article();
                } 
                else {console.error('error', xhr.statusText);}
            }
        };
        xhr.send();
    }
    window.addEventListener('load', load_blog_article);
  </script>
<br>
<footer style="width: 111px;margin: 0 auto 0;padding:8px;" role="contentinfo">by_oneblockh</footer>
</body>
